<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Site Moved - BitCentral</title>

    <!-- SEO -->
    <link rel="canonical" href="https://bitcentral.bitsathy.in/" />

    <!-- Redirect fallback after 5 seconds -->
    <meta http-equiv="refresh" content="5; url=https://bitcentral.bitsathy.in/" />

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .box {
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5e1;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

    <script>
        // show a 3 -> 2 -> 1 countdown then redirect
        (function () {
            const start = 3;
            let remaining = start;

            function updateDisplay() {
                const el = document.getElementById('countdown');
                if (el) el.textContent = remaining;
            }

            updateDisplay();

            const timer = setInterval(() => {
                remaining -= 1;
                if (remaining > 0) {
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    window.location.replace('https://bitcentral.bitsathy.in/');
                }
            }, 1000);
        })();
    </script>
</head>
<body>
    <div class="box">
        <h1>This site has moved</h1>

        <p>
            BitCentral is now available at
            <br><br>
            <a href="https://bitcentral.bitsathy.in/">
                https://bitcentral.bitsathy.in/
            </a>
        </p>

        <p>You will be redirected automatically in <span id="countdown">3</span> seconds...</p>
    </div>
</body>
</html>
